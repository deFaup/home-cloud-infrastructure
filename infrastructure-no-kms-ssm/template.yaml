AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Home Cloud Stack. Creates a lambda function that will serve as signup page (via a public lambda function URL).
  Signup requires username and email address.
  The page send the signup request by email (via SES) to the admin.
  Included in that email are two links to an approve/deny lambda function.
  Request to this lambda are authenticated using Fernet-encrypted user email address (present in the email to the admin).
  The approve function creates the user account via a json API endpoint accessible over Tailscale.
  Secrets are stored in SSM Parameter Store SecureString (created via setup script, not CloudFormation).

Parameters:
  FromAdminEmail:
    Type: String
    Description: Email address used as the sender (SES From). Must be a verified SES identity.
  ToAdminEmail:
    Type: String
    Description: Email address that receives signup notifications (SES To). Defaults to FromAdminEmail if left empty.
    Default: ""
  UserApiBaseUrl:
    Type: String
    Description: >
      Base URL of the Json API endpoint accessible on your Tailscale network
      (e.g. http://my-server:3000 or http://100.x.y.z:3000).
  UserApiUsername:
    Type: String
    Description: Username for Basic auth on the User API.
  Architecture:
    Type: String
    Default: x86_64
    AllowedValues:
      - arm64
      - x86_64
    Description: Must match your CPU architecture. x86_64 for Intel/AMD machines. arm64 for ARM-based machines (e.g. Raspberry Pi, Apple M1/M2).

Conditions:
  HasToEmail: !Not [!Equals [!Ref ToAdminEmail, ""]]

Resources:
  # ── Signup Lambda function ────────────────────────────────────────────────────────
  SignupFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-signup-lambda"
      Runtime: python3.12
      Architectures:
        - !Ref Architecture
      Handler: lambda_signup.signup.main # <dotted path>.<filename>.<handler_function>
      # Handler: signup.main # uncomment if you decide to zip the signup directory instead of using cfn package
      Role: !GetAtt SignupLambdaExecutionRole.Arn
      Timeout: 90
      MemorySize: 128
      # Code: # uncomment if using 'aws cfn package' command
      #   S3Bucket: home-cloud-bucket
      #   S3Key: signup.zip
      PackageType: Zip
      Environment:
        Variables:
          FROM_ADMIN_EMAIL: !Ref FromAdminEmail
          TO_ADMIN_EMAIL: !If [HasToEmail, !Ref ToAdminEmail, ""]
          FERNET_KEY_PARAM: !Sub "/${AWS::StackName}/fernet-key"
          APPROVE_FUNCTION_NAME: !Ref CreateUserFunction

  # ── Signup Lambda function URL — public HTTPS endpoint  ──────────────────────────────────
  SignupFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref SignupFunction
      AuthType: NONE

  SignupFunctionUrlAllowPublicAccess:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref SignupFunction
      FunctionUrlAuthType: NONE
      Principal: "*"

  SignupFunctionUrlAllowInvokeAction:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SignupFunction
      InvokedViaFunctionUrl: true
      Principal: "*"

  # ── IAM roles and policies for the signup function ───────────────────────
  SignupLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  SignupLambdaSesPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-signup-ses-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: ses:SendEmail
            Resource: "*"
      Roles:
        - !Ref SignupLambdaExecutionRole

  SignupLambdaInvokeApprovePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-signup-invoke-lambda-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt CreateUserFunction.Arn
      Roles:
        - !Ref SignupLambdaExecutionRole

  SignupLambdaSsmPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-signup-ssm-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ssm:GetParameter
            Resource:
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/fernet-key"
          - Effect: Allow
            Action:
              - kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
      Roles:
        - !Ref SignupLambdaExecutionRole

  # ── SES identities (must be verified in sandbox mode) ─────────────────────
  FromAdminEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref FromAdminEmail

  ToAdminEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: HasToEmail
    Properties:
      EmailIdentity: !Ref ToAdminEmail



  # ── CreateUser Lambda — container image with Tailscale ────────────────────────
  CreateUserFunction:
    Type: AWS::Lambda::Function
    DependsOn: CreateUserLambdaEcrPolicy
    Properties:
      FunctionName: !Sub "${AWS::StackName}-create-user-lambda"
      PackageType: Image
      Architectures:
        - !Ref Architecture
      Code:
        ImageUri: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/home-cloud-ecr-repo:latest"
      Role: !GetAtt CreateUserLambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 128
      Environment:
        Variables:
          FERNET_KEY_PARAM: !Sub "/${AWS::StackName}/fernet-key"
          API_BASE_URL: !Ref UserApiBaseUrl
          API_USERNAME: !Ref UserApiUsername
          TAILSCALE_AUTHKEY_PARAM: !Sub "/${AWS::StackName}/tailscale-auth-key"
          ADMIN_API_PASSWORD_PARAM: !Sub "/${AWS::StackName}/admin-api-password"

  # ── IAM roles and policies for the approval function ───────────────────────
  CreateUserLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  CreateUserLambdaEcrPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-create-user-ecr-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:GetAuthorizationToken
            Resource: "*"
      Roles:
        - !Ref CreateUserLambdaExecutionRole

  CreateUserLambdaSsmPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-create-user-ssm-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ssm:GetParameter
            Resource:
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/fernet-key"
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/tailscale-auth-key"
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/admin-api-password"
          - Effect: Allow
            Action:
              - kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
      Roles:
        - !Ref CreateUserLambdaExecutionRole

Outputs:
  SignupUrl:
    Description: Public URL of the signup page — share this with users.
    Value: !GetAtt SignupFunctionUrl.FunctionUrl
