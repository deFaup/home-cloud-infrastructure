AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Home Cloud registration service — Lambda serves a signup page and sends
  registration emails via SES.  Uses Lambda Function URL (no API Gateway).

Parameters:
  AdminEmail:
    Type: String
    Description: Email address of the administrator who receives registration requests.
  ApproveToken:
    Type: String
    Description: Secret token appended to approve/deny links (prevents casual guessing).
    Default: change-me-to-a-random-string
    NoEcho: true

Resources:
  # ── Lambda function ────────────────────────────────────────────────────────
  RegistrationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-registration"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 15
      MemorySize: 128
      Environment:
        Variables:
          ADMIN_EMAIL: !Ref AdminEmail
          APPROVE_TOKEN: !Ref ApproveToken
          # Function URL is baked in at deploy time via !Sub
          REGISTRATION_HTML: !Sub |
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Home Cloud — Request Access</title>
              <style>
                :root {
                  --bg: #0f172a;
                  --surface: #1e293b;
                  --border: #334155;
                  --text: #e2e8f0;
                  --text-secondary: #94a3b8;
                  --text-muted: #64748b;
                  --accent: #3b82f6;
                  --accent-hover: #2563eb;
                  --radius: 10px;
                }
                @media (prefers-color-scheme: light) {
                  :root {
                    --bg: #f8fafc;
                    --surface: #ffffff;
                    --border: #e2e8f0;
                    --text: #1e293b;
                    --text-secondary: #475569;
                    --text-muted: #64748b;
                    --accent: #2563eb;
                    --accent-hover: #1d4ed8;
                  }
                }
                *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
                body {
                  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                  background: var(--bg);
                  color: var(--text);
                  line-height: 1.6;
                  min-height: 100vh;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  padding: 2rem 1rem;
                }
                .card {
                  background: var(--surface);
                  border: 1px solid var(--border);
                  border-radius: var(--radius);
                  padding: 2.5rem 2rem;
                  max-width: 440px;
                  width: 100%;
                  text-align: center;
                }
                .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
                h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.35rem; }
                .subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 2rem; }
                .form-group { text-align: left; margin-bottom: 1rem; }
                label {
                  display: block;
                  font-size: 0.8rem;
                  font-weight: 600;
                  color: var(--text-secondary);
                  margin-bottom: 0.3rem;
                }
                input[type="text"],
                input[type="email"] {
                  width: 100%;
                  padding: 0.65rem 0.85rem;
                  border: 1px solid var(--border);
                  border-radius: 6px;
                  background: var(--bg);
                  color: var(--text);
                  font-size: 0.9rem;
                  outline: none;
                  transition: border-color 0.2s;
                }
                input:focus { border-color: var(--accent); }
                .btn {
                  width: 100%;
                  padding: 0.7rem;
                  border: none;
                  border-radius: 6px;
                  background: var(--accent);
                  color: #fff;
                  font-size: 0.95rem;
                  font-weight: 600;
                  cursor: pointer;
                  margin-top: 0.5rem;
                  transition: background 0.2s;
                }
                .btn:hover { background: var(--accent-hover); }
                .btn:disabled { opacity: 0.6; cursor: not-allowed; }
                .confirmation { display: none; }
                .confirmation .check { font-size: 3rem; margin-bottom: 0.75rem; }
                .confirmation h2 { font-size: 1.25rem; margin-bottom: 0.5rem; }
                .confirmation p { color: var(--text-secondary); font-size: 0.9rem; }
                .note { margin-top: 1.5rem; font-size: 0.75rem; color: var(--text-muted); }
                .error { color: #fca5a5; font-size: 0.8rem; margin-top: 0.5rem; display: none; }
              </style>
            </head>
            <body>
            <div class="card">
              <div id="formView">
                <div class="icon">☁️</div>
                <h1>Welcome to your home cloud storage</h1>
                <p class="subtitle">Sign up using the form below to request access to your home cloud.</p>
                <form id="registerForm" action="/" method="POST">
                  <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a username" required>
                  </div>
                  <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                  </div>
                  <button type="submit" class="btn" id="submitBtn">Submit</button>
                  <p class="error" id="errorMsg"></p>
                </form>
                <p class="note">Your request will be reviewed by an administrator.</p>
              </div>
              <div id="confirmView" class="confirmation">
                <div class="check">✅</div>
                <h2>Application Submitted</h2>
                <p>Thank you for signing up! Your request has been received and is being reviewed.</p>
                <p style="margin-top: 0.75rem;">You will receive a confirmation by email with follow-up information once your request is accepted.</p>
              </div>
            </div>
            <script>
              document.getElementById('registerForm').addEventListener('submit', async function (e) {
                e.preventDefault();
                const btn = document.getElementById('submitBtn');
                const errorMsg = document.getElementById('errorMsg');
                btn.disabled = true;
                btn.textContent = 'Submitting…';
                errorMsg.style.display = 'none';
                try {
                  const resp = await fetch(window.location.href, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams(new FormData(this)).toString()
                  });
                  if (!resp.ok) throw new Error('Server error');
                  document.getElementById('formView').style.display = 'none';
                  document.getElementById('confirmView').style.display = 'block';
                } catch (err) {
                  errorMsg.textContent = 'Something went wrong. Please try again.';
                  errorMsg.style.display = 'block';
                  btn.disabled = false;
                  btn.textContent = 'Submit';
                }
              });
            </script>
            </body>
            </html>
      Code:
        ZipFile: |
          import os
          import json
          import urllib.parse
          import boto3
          from botocore.exceptions import ClientError

          ses = boto3.client("ses")

          ADMIN_EMAIL = os.environ["ADMIN_EMAIL"]
          APPROVE_TOKEN = os.environ["APPROVE_TOKEN"]
          REGISTRATION_HTML = os.environ["REGISTRATION_HTML"]

          # Function URL — the base URL of this Lambda
          # Resolved from the request context at runtime
          def get_base_url(event):
              headers = event.get("headers", {})
              host = headers.get("host", "")
              scheme = headers.get("x-forwarded-proto", "https")
              return f"{scheme}://{host}"


          def handler(event, context):
              method = event["requestContext"]["http"]["method"]
              path = event["rawPath"]

              if method == "GET" and path == "/":
                  return html_response(200, REGISTRATION_HTML)

              if method == "POST" and path == "/":
                  return handle_registration(event)

              return html_response(404, "<h1>404 — Not Found</h1>")


          def handle_registration(event):
              body = event.get("body", "")
              if event.get("isBase64Encoded"):
                  import base64
                  body = base64.b64decode(body).decode()

              params = urllib.parse.parse_qs(body)
              username = (params.get("username", [""])[0]).strip()
              email = (params.get("email", [""])[0]).strip()

              if not username or not email:
                  return html_response(400, "<h1>Missing fields</h1><p>Username and email are required.</p>")

              base_url = get_base_url(event)
              approve_url = f"{base_url}/approve?token={APPROVE_TOKEN}&user={urllib.parse.quote(username)}&email={urllib.parse.quote(email)}"
              deny_url = f"{base_url}/deny?token={APPROVE_TOKEN}&user={urllib.parse.quote(username)}&email={urllib.parse.quote(email)}"

              email_body = (
                  f"New registration request\n"
                  f"────────────────────────\n"
                  f"Username: {username}\n"
                  f"Email:    {email}\n\n"
                  f"Actions:\n"
                  f"  ✅ Approve: {approve_url}\n"
                  f"  ❌ Deny:    {deny_url}\n"
              )

              try:
                  ses.send_email(
                      Source=ADMIN_EMAIL,
                      Destination={"ToAddresses": [ADMIN_EMAIL]},
                      Message={
                          "Subject": {"Data": f"Registration request from {username}"},
                          "Body": {"Text": {"Data": email_body}},
                      },
                  )
              except ClientError as exc:
                  print(f"SES error: {exc}")
                  return html_response(500, "<h1>Email send failed</h1><p>Please try again later.</p>")

              success = """
              <!DOCTYPE html>
              <html lang="en"><head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Request Submitted</title>
              <style>
                :root{--bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#e2e8f0;--text-secondary:#94a3b8;--radius:10px}
                @media(prefers-color-scheme:light){:root{--bg:#f8fafc;--surface:#fff;--border:#e2e8f0;--text:#1e293b;--text-secondary:#475569}}
                *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
                body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
                .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;max-width:440px;width:100%;text-align:center}
                .check{font-size:3rem;margin-bottom:0.75rem}h2{font-size:1.25rem;margin-bottom:0.5rem}
                p{color:var(--text-secondary);font-size:0.9rem;line-height:1.6}
              </style></head><body>
              <div class="card">
                <div class="check">✅</div>
                <h2>Application Submitted</h2>
                <p>Thank you for signing up! Your request has been received and is being reviewed.</p>
                <p style="margin-top:0.75rem">You will receive a confirmation by email with follow-up information once your request is accepted.</p>
              </div>
              </body></html>
              """
              return html_response(200, success)


          def html_response(status, body):
              return {
                  "statusCode": status,
                  "headers": {
                      "Content-Type": "text/html; charset=utf-8",
                      "Cache-Control": "no-store",
                  },
                  "body": body,
              }

  # ── Function URL — public HTTPS endpoint (no API Gateway needed) ───────────
  RegistrationFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref RegistrationFunction
      AuthType: NONE

  # Allow public invocations via the Function URL
  RegistrationFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RegistrationFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"

  # ── IAM ────────────────────────────────────────────────────────────────────
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  LambdaSesPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-ses-send"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: ses:SendEmail
            Resource: "*"
      Roles:
        - !Ref LambdaExecutionRole

  # ── SES identity (admin email must be verified in sandbox mode) ─────────────
  AdminEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref AdminEmail

Outputs:
  RegistrationUrl:
    Description: Public URL of the registration page — share this with users.
    Value: !GetAtt RegistrationFunctionUrl.FunctionUrl

  RegistrationFunctionArn:
    Value: !GetAtt RegistrationFunction.Arn
