AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Home Cloud Stack. Creates a lambda function that will serve as signup page (via a public lambda function URL).
  Signup requires username and email address.
  The page send the registration request by email (via SES) to the admin.
  Included in that email are two links to an approve/deny lambda function.
  Request to this lambda are authenticated using the KMS-encrypted user email address (present in the email to the admin).
  The approve function creates the user account via a json API endpoint accessible over Tailscale.

Parameters:
  FromAdminEmail:
    Type: String
    Description: Email address used as the sender (SES From). Must be a verified SES identity.
  ToAdminEmail:
    Type: String
    Description: Email address that receives registration notifications (SES To). Defaults to FromAdminEmail if left empty.
    Default: ""
  ApproveApiBaseUrl:
    Type: String
    Description: >
      Base URL of the Json API endpoint accessible on your Tailscale network
      (e.g. http://my-server:3000 or http://100.x.y.z:3000).
  ApproveApiUsername:
    Type: String
    Description: Username for Basic auth on the registration API.

Conditions:
  HasToEmail: !Not [!Equals [!Ref ToAdminEmail, ""]]

Resources:
  # ── Registration Lambda function ────────────────────────────────────────────────────────
  RegistrationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-lambda"
      Runtime: python3.14
      Handler: lambda.register.main # <dotted path>.<filename>.<handler_function>
      Role: !GetAtt RegisterLambdaExecutionRole.Arn
      Timeout: 90
      MemorySize: 128
      Environment:
        Variables:
          FROM_ADMIN_EMAIL: !Ref FromAdminEmail
          TO_ADMIN_EMAIL: !If [HasToEmail, !Ref ToAdminEmail, ""]
          KMS_KEY_ID: !Ref RegistrationEncryptionKey
          APPROVE_FUNCTION_NAME: !Ref ApproveFunction

  # ── Registration Lambda function URL — public HTTPS endpoint  ──────────────────────────────────
  RegistrationFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref RegistrationFunction
      AuthType: NONE

  RegistrationFunctionUrlAllowPublicAccess:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref RegistrationFunction
      FunctionUrlAuthType: NONE
      Principal: "*"

  RegistrationFunctionUrlAllowInvokeAction:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RegistrationFunction
      InvokedViaFunctionUrl: true
      Principal: "*"

  # ── KMS key for encrypting approve/deny tokens ─────────────────────────────
  RegistrationEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts email addresses in approve/deny registration links.
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowRegisterLambdaUsage
            Effect: Allow
            Principal:
              AWS: !GetAtt RegisterLambdaExecutionRole.Arn
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:DescribeKey
            Resource: "*"
          - Sid: AllowApproveLambdaDecrypt
            Effect: Allow
            Principal:
              AWS: !GetAtt ApproveLambdaExecutionRole.Arn
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: "*"

  RegistrationEncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: "alias/home-cloud-registration-encryption-key"
      TargetKeyId: !Ref RegistrationEncryptionKey

  # ── IAM roles and policies for the register function ───────────────────────
  RegisterLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  RegisterLambdaSesPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-ses-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: ses:SendEmail
            Resource: "*"
      Roles:
        - !Ref RegisterLambdaExecutionRole

  RegisterLambdaInvokeApprovePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-invoke-approve-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt ApproveFunction.Arn
      Roles:
        - !Ref RegisterLambdaExecutionRole

  # ── SES identities (must be verified in sandbox mode) ─────────────────────
  FromAdminEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref FromAdminEmail

  ToAdminEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: HasToEmail
    Properties:
      EmailIdentity: !Ref ToAdminEmail



  # ── Approve Lambda — container image with Tailscale ────────────────────────
  ApproveFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApproveLambdaEcrPolicy
    Properties:
      FunctionName: !Sub "${AWS::StackName}-approve"
      PackageType: Image
      Architectures:
        - arm64 # Use - x86_64 if building on an x86 machine
      Code:
        ImageUri: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/home-cloud-registration-approve:latest"
      Role: !GetAtt ApproveLambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 128
      Environment:
        Variables:
          KMS_KEY_ID: !Ref RegistrationEncryptionKey
          API_BASE_URL: !Ref ApproveApiBaseUrl
          API_USERNAME: !Ref ApproveApiUsername
          TAILSCALE_AUTHKEY_ARN: !Ref TailscaleAuthKeySecret
          ADMIN_API_PASSWORD_ARN: !Ref AdminApiPasswordSecret

  # ── Secrets Manager secrets (populated manually after deploy) ───────────────
  TailscaleAuthKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/tailscale-auth-key"
      Description: >
        Tailscale ephemeral auth key (tskey-auth-...). Update this value in
        the AWS Console or CLI after the stack is deployed. The Lambda function
        fetches it at runtime, not stored as a lambda environment variables.

  AdminApiPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/admin-api-password"
      Description: >
        Basic auth password for the registration API. Update this value in
        the AWS Console or CLI after the stack is deployed. The Lambda function
        fetches it at runtime, not stored as a lambda environment variables.

  # ── IAM roles and policies for the approval function ───────────────────────
  ApproveLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  ApproveLambdaEcrPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-approve-ecr-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:GetAuthorizationToken
            Resource: "*"
      Roles:
        - !Ref ApproveLambdaExecutionRole

  ApproveLambdaSecretsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-approve-secrets-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Ref TailscaleAuthKeySecret
              - !Ref AdminApiPasswordSecret
      Roles:
        - !Ref ApproveLambdaExecutionRole

Outputs:
  RegistrationUrl:
    Description: Public URL of the registration page — share this with users.
    Value: !GetAtt RegistrationFunctionUrl.FunctionUrl
