AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Home Cloud Stack. Creates a lambda function that will serve as signup page (via a public lambda function URL).
  Signup requires username and email address.
  The page send the registration request by email (via SES) to the admin.
  Included in that email are two links to an approve/deny lambda function.
  Request to this lambda are authenticated using the KMS-encrypted user email address (present in the email to the admin).

Parameters:
  FromAdminEmail:
    Type: String
    Description: Email address used as the sender (SES From). Must be a verified SES identity.
  ToAdminEmail:
    Type: String
    Description: Email address that receives registration notifications (SES To). Defaults to FromAdminEmail if left empty.
    Default: ""

Conditions:
  HasToEmail: !Not [!Equals [!Ref ToAdminEmail, ""]]

Resources:
  # ── Lambda function ────────────────────────────────────────────────────────
  RegistrationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-lambda"
      Runtime: python3.12
      Handler: lambda.index.handler # <dotted path>.<filename>.<handler_function>
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 15
      MemorySize: 128
      Environment:
        Variables:
          FROM_ADMIN_EMAIL: !Ref FromAdminEmail
          TO_ADMIN_EMAIL: !If [HasToEmail, !Ref ToAdminEmail, ""]
          KMS_KEY_ID: !Ref RegistrationEncryptionKey

  # ── Function URL — public HTTPS endpoint  ──────────────────────────────────
  RegistrationFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref RegistrationFunction
      AuthType: NONE

  RegistrationFunctionUrlAllowPublicAccess:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref RegistrationFunction
      FunctionUrlAuthType: NONE
      Principal: "*"

  RegistrationFunctionUrlAllowInvokeAction:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RegistrationFunction
      InvokedViaFunctionUrl: true
      Principal: "*"

  # ── KMS key for encrypting approve/deny tokens ─────────────────────────────
  RegistrationEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts email addresses in approve/deny registration links.
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowLambdaUsage
            Effect: Allow
            Principal:
              AWS: !GetAtt LambdaExecutionRole.Arn
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:DescribeKey
            Resource: "*"

  RegistrationEncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: "alias/home-cloud-registration-encryption-key"
      TargetKeyId: !Ref RegistrationEncryptionKey

  # ── IAM ────────────────────────────────────────────────────────────────────
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  LambdaSesPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-ses-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: ses:SendEmail
            Resource: "*"
      Roles:
        - !Ref LambdaExecutionRole

  # ── SES identities (must be verified in sandbox mode) ─────────────────────
  FromAdminEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref FromAdminEmail

  ToAdminEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: HasToEmail
    Properties:
      EmailIdentity: !Ref ToAdminEmail

Outputs:
  RegistrationUrl:
    Description: Public URL of the registration page — share this with users.
    Value: !GetAtt RegistrationFunctionUrl.FunctionUrl
